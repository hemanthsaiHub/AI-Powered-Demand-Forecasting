name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ api/ --max-line-length=120 --ignore=E203,W503 --exclude=__pycache__

      - name: Generate synthetic data
        run: python src/generate_data.py

      - name: Train model (smoke test)
        run: python src/train.py

      - name: Run anomaly detection (smoke test)
        run: python src/anomaly_detection.py

      - name: Run cost savings simulation (smoke test)
        run: python src/cost_savings.py

      - name: Run unit tests
        run: pytest tests/ -v

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t demand-forecast-api:latest .

      - name: Build Dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t demand-forecast-dashboard:latest .

  # To deploy for free: connect this repo to Render.com, Railway.app, or
  # Fly.io (all have free tiers) and add a deploy job here, or use
  # Streamlit Community Cloud for the dashboard (completely free hosting).
